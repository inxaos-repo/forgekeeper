name: Build & Publish mmf-fetch sidecar

on:
  push:
    branches: [main]
    paths: ['sidecars/mmf-fetch/**', '.github/workflows/mmf-fetch.yml']
  pull_request:
    branches: [main]
    paths: ['sidecars/mmf-fetch/**', '.github/workflows/mmf-fetch.yml']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-mmf-fetch

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test (healthz + allowlist, no MMF traffic)
        working-directory: sidecars/mmf-fetch
        run: |
          docker build -t mmf-fetch:ci .
          docker run -d --name mf -e FETCH_BIND=0.0.0.0 -p 127.0.0.1:8199:8199 mmf-fetch:ci
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8199/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Fetch-Url: https://example.com/' http://127.0.0.1:8199/fetch)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8199/fetch)" = 400
          docker rm -f mf

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: sidecars/mmf-fetch
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
